# n8n stack for client delivery.
#
# Sized for a 2.5GB free-RAM box: Postgres 12 gets its own container with
# conservative limits, n8n gets a hard memory cap so a runaway execution
# cannot take the whole host down and strand every other client's workflow.
#
# Why self-hosted: data-sovereignty clients (Gulf legal, healthcare, finance)
# often refuse to have their pipeline data on a US SaaS. Self-hosting is a
# selling point, not just a cost saving.
#
# Copy .env.example to .env and set N8N_ENCRYPTION_KEY before any real client
# data lands here. Rotating that key makes stored credentials unrecoverable.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Small and capped: this holds workflow state, not a warehouse.
    command: >
      postgres
        -c shared_buffers=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c max_connections=40
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 512M

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bound to loopback. Never expose n8n to the public internet:
      # it has no auth configured until an owner account exists, and it holds
      # every client's credentials. Put it behind a TLS reverse proxy.
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}

      # Execution bookkeeping. We keep finished runs short so the DB stays small
      # on a small VPS, but keep failures long, because that is what you
      # actually need when a client asks why their lead was not contacted.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 2000

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_METRICS: "true"
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_RUNNERS_ENABLED: "true"

      # Client isolation happens at the project level inside n8n, not here.
      # Set per-client encryption keys only if a contract demands it.
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1200M

volumes:
  pgdata:
  n8n_data:
