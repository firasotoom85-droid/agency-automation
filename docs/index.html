<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<title>Real Estate Agency Automation · أتمتة وكالات العقارات</title>
<meta name="description" content="Automation for real estate agencies — instant lead response, viewing confirmation, no-show reduction.">
<meta http-equiv="refresh" content="0; url=./en/">

<link rel="stylesheet" href="style.css">
<style>
  .pick { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); max-width: 640px; margin: 40px auto; }
  .pick a { display: block; padding: 26px 22px; border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--fg); background: var(--bg); }
  .pick a:hover { border-color: var(--accent); }
  .pick strong { display: block; font-size: 1.15rem; margin-bottom: 4px; }
  .pick span { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <div class="wrap" style="text-align:center;padding-block:64px 24px">
    <h1>Choose your language</h1>
    <p class="lede" style="margin-inline:auto">اختر لغتك</p>
  </div>
  <div class="wrap">
    <div class="pick">
      <a href="./ar/" hreflang="ar" lang="ar" dir="rtl">
        <strong lang="ar" dir="rtl">العربية</strong>
        <span lang="ar" dir="rtl">أتمتة وكالات العقارات</span>
      </a>
      <a href="./en/" hreflang="en" lang="en" dir="ltr">
        <strong>English</strong>
        <span>Real estate agency automation</span>
      </a>
    </div>
  </div>
</main>
</body>
</html>
